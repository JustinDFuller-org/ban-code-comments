name: Action smoke

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release-tag:
        description: Published release tag to test
        required: true
        default: v1.0.0

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout published Action release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
      - name: Verify clean scan
        uses: ./
        with:
          paths: test/fixtures/go/clean
          languages: go
          format: json
          debug: 'true'
      - name: Verify findings fail the step
        id: findings
        continue-on-error: true
        uses: ./
        with:
          paths: test/fixtures/go/finding
          languages: go
          include: test/fixtures/go/**
          exclude: test/fixtures/go/clean/**
          format: text
      - name: Assert findings were reported
        if: steps.findings.outcome != 'failure'
        shell: bash
        run: exit 1
      - name: Verify operational failures fail the step
        id: operational
        continue-on-error: true
        uses: ./
        with:
          paths: test/fixtures/go/clean
          format: unsupported
      - name: Assert operational failure was reported
        if: steps.operational.outcome != 'failure'
        shell: bash
        run: exit 1
      - name: Verify bundled entrypoint preserves exact finding status
        shell: bash
        run: |
          set +e
          INPUT_PATHS=test/fixtures/go/finding INPUT_LANGUAGES=go INPUT_FORMAT=text node dist/index.js
          status=$?
          set -e
          test "$status" -eq 1
      - name: Verify bundled entrypoint preserves exact operational status
        shell: bash
        run: |
          set +e
          INPUT_PATHS=test/fixtures/go/clean INPUT_FORMAT=unsupported node dist/index.js
          status=$?
          set -e
          test "$status" -eq 2
      - name: Verify bundled entrypoint emits debug diagnostics
        shell: bash
        run: |
          INPUT_PATHS=README.md INPUT_FORMAT=json INPUT_DEBUG=true node dist/index.js 2>debug.log
          grep -F "debug: README.md: unsupported file" debug.log

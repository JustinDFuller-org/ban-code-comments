name: Action smoke

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release-tag:
        description: Published release tag to test
        required: true
        default: v1.0.0

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout published Action release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release-tag }}
      - name: Verify clean scan
        uses: ./
        with:
          paths: internal/scanner/testdata/fixtures/go/clean
          languages: go
          format: json
          debug: 'true'
      - name: Verify findings fail the step
        id: findings
        continue-on-error: true
        uses: ./
        with:
          paths: internal/scanner/testdata/fixtures/go/finding
          languages: go
          include: internal/scanner/testdata/fixtures/go/**
          exclude: internal/scanner/testdata/fixtures/go/clean/**
          format: text
      - name: Assert findings were reported
        if: steps.findings.outcome != 'failure'
        shell: bash
        run: exit 1

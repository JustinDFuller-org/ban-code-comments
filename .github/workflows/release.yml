name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  npm:
    if: contains(github.ref_name, '.')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Validate semantic version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "unsupported release tag: $RELEASE_TAG" >&2
            exit 1
          fi
      - name: Install package dependencies
        run: npm ci
      - name: Validate package and integrations
        run: |
          npm test
          npm run coverage
          npm run validate:plugins
          npm run build
          npm run build:plugins
          git diff --exit-code -- dist plugins/ban-code-comments-hard-block/bin/launcher.js plugins/ban-code-comments-warn/bin/launcher.js licenses.txt
          node scripts/check-release-version.mjs
          npm pack --dry-run
          test "$(node bin/ban-code-comments.js --version)" = "${RELEASE_TAG#v}"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Publish package
        run: npm publish --access public
      - name: Update major Action tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          major_tag="${RELEASE_TAG%%.*}"
          latest_major_tag="$(git tag --list "${major_tag}.*" | sort -V | tail -n 1)"
          if [[ -n "$latest_major_tag" && "$(printf '%s\n' "$latest_major_tag" "$RELEASE_TAG" | sort -V | tail -n 1)" != "$RELEASE_TAG" ]]; then
            echo "not moving $major_tag backward from $latest_major_tag to $RELEASE_TAG"
            exit 0
          fi
          git tag -f "$major_tag" "$RELEASE_SHA"
          remote_major_sha="$(git ls-remote --refs origin "refs/tags/$major_tag" | awk '{print $1}')"
          if [[ -n "$remote_major_sha" ]]; then
            git push origin "refs/tags/$major_tag" --force-with-lease="refs/tags/$major_tag:$remote_major_sha"
          else
            git push origin "refs/tags/$major_tag" --force-with-lease="refs/tags/$major_tag:"
          fi

name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout protected release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Validate semantic version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          if [[ ! "$RELEASE_REF" =~ ^refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "unsupported release tag: $RELEASE_TAG" >&2
            exit 1
          fi
      - name: Validate release commit
        run: |
          git fetch origin main --quiet
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)"
      - name: Install package dependencies
        run: npm ci
      - name: Validate package and integrations
        run: |
          npm test
          npm run coverage
          npm run validate:plugins
          npm run validate:claude-plugins
          npm run build
          npm run build:plugins
          git diff --exit-code -- dist plugins/ban-code-comments-hard-block/bin/launcher.js plugins/ban-code-comments-warn/bin/launcher.js plugins/ban-code-comments-claude-hard-block/bin/launcher.js plugins/ban-code-comments-claude-warn/bin/launcher.js licenses.txt
          node scripts/check-release-version.mjs
          npm pack --dry-run
          test "$(node bin/ban-code-comments.js --version)" = "${RELEASE_TAG#v}"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Publish package
        run: npm publish --access public

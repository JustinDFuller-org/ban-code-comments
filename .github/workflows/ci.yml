name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.x
          cache: npm
      - name: Install package dependencies
        run: npm ci
      - name: Run Node test suite
        run: npm test
      - name: Enforce JavaScript coverage
        run: npm run coverage
      - name: Validate Codex plugins
        run: npm run validate:plugins
      - name: Verify generated distributions
        run: |
          npm run build
          npm run build:plugins
          git diff --exit-code -- dist plugins/ban-code-comments-hard-block/bin/launcher.js plugins/ban-code-comments-warn/bin/launcher.js licenses.txt
      - name: Ban code comments with the package CLI
        run: node bin/ban-code-comments.js --format text --exclude 'internal/scanner/testdata/fixtures/**' --exclude 'test/fixtures/**' --exclude 'internal/hook/testdata/**' --exclude 'plugins/**' .
      - name: Validate OpenSpec
        run: npx --yes @fission-ai/openspec@1.13.0 validate --changes --strict

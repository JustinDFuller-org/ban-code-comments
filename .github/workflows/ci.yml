name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.0'
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Run tests
        run: go test ./...
      - name: Ban code comments with the local CLI
        run: go run ./cmd/ban-code-comments --format text --exclude 'internal/scanner/testdata/fixtures/**' .
      - name: Run static analysis
        run: go vet ./...
      - name: Validate OpenSpec
        run: npx --yes @fission-ai/openspec@1.13.0 validate --changes --strict
      - name: Validate GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94
        with:
          version: v2.18.1
          args: check
      - name: Build release snapshot
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94
        with:
          version: v2.18.1
          args: release --snapshot --clean --skip=publish
